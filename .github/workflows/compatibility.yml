name: Compatibility

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Paper 1.21.11
            java: '21'
            paper: 1.21.11-R0.1-SNAPSHOT
          - label: Paper 26.1.2
            java: '25'
            paper: 26.1.2.build.74-stable
          - label: Paper 26.2
            java: '25'
            paper: 26.2.build.84-stable
          - label: Paper 26.3
            java: '25'
            paper: 26.3.build.142-beta

    name: ${{ matrix.label }} / Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify -Dpaper.version=${{ matrix.paper }}
